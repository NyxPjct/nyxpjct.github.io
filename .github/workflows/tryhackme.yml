name: Atualiza dados do TryHackMe

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia, 07:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tryhackme-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Busca o perfil público do TryHackMe
        run: |
          set -uo pipefail
          ok=0
          for wait in 0 30 90; do
            sleep "$wait"
            if curl -fsS --max-time 20 -H "Accept: application/json" -A "Mozilla/5.0 (nyxpjct.github.io portfolio stats)" \
                 "https://tryhackme.com/api/v2/public-profile?username=ATHOS" -o /tmp/thm.json \
               && jq -e '.status == "success" and (.data.level | type == "number")' /tmp/thm.json > /dev/null; then
              ok=1; break
            fi
            echo "Tentativa falhou, tentando de novo depois de uma pausa..."
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::O TryHackMe não respondeu agora. O site continua com os últimos números salvos."
            echo "skip=1" >> "$GITHUB_ENV"; exit 0
          fi
          set -e
          jq '{username: .data.username, level: .data.level, rank: .data.rank, points: .data.totalPoints,
               rooms: .data.completedRoomsNumber, badges: .data.badgesNumber, largestStreak: .data.largestStreak,
               path: (.data.enrolledPath.title // null), updatedAt: (now | todate)}' /tmp/thm.json > /tmp/new.json

      - name: Salva se os números mudaram
        if: env.skip != '1'
        run: |
          set -euo pipefail
          if [ -f assets/data/thm.json ] && \
             [ "$(jq -S 'del(.updatedAt)' assets/data/thm.json)" = "$(jq -S 'del(.updatedAt)' /tmp/new.json)" ]; then
            echo "Nada mudou."; exit 0
          fi
          cp /tmp/new.json assets/data/thm.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/thm.json
          git commit -m "Atualiza dados do TryHackMe"
          git push
